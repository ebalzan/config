# =============================================================================
# Deploy — what ships a release of THIS repo. Yours to edit.
#
# release.yml calls it with the new tag after every release. Run it by hand
# (Actions → Deploy → Run workflow) to redeploy any tag, or to roll back to an
# older one.
#
# Publishes the tag to npm. A version npm already has is skipped, so a re-run
# is harmless.
#
# npm trusted publishing (OIDC, no token): on npmjs.com, @ebalzan/config →
# Settings → Trusted publishing → GitHub Actions, repository ebalzan/config,
# workflow release.yml (a release's run) — add deploy.yml too for runs by hand
# — and environment `npm`. Do not limit the environment to the main branch: a
# release's run has the ref refs/pull/<n>/merge, so it would be refused.
#
# Permissions: the block below, for a run by hand. On a release, the `deploy`
# job of release.yml grants them and this file may not ask for more — change
# both together.
# Generated by `ebalzan-ci onboard`, which never overwrites it (not even with
# --force): changes here are yours to keep.
# =============================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release to deploy (vX.Y.Z).
        type: string
        required: true

# Same as the `deploy` job of release.yml.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: npm
    # One publish at a time, never cancelled half-way.
    concurrency:
      group: deploy-npm
      cancel-in-progress: false
    steps:
      - uses: ebalzan/ci/actions/setup@v2
        with:
          checkout-ref: ${{ inputs.tag }}
          node-registry-url: https://registry.npmjs.org

      # The package is its source files (package.json "files"): no install and
      # no build. --ignore-scripts skips `prepublishOnly` (npm run check, which
      # needs the devDependencies); PR Checks already ran it on this commit.
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG has package.json version $version."
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm: nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
